<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADScope · Acceso</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 28%, #1c2637 0%, #0f141e 72%);
    color: #e2e8f0; padding: 20px; line-height: 1.5;
  }
  .card {
    width: 100%; max-width: 400px;
    background: #161e2e; border: 1px solid #2c3a52; border-radius: 16px;
    padding: 38px 32px; box-shadow: 0 14px 36px rgba(0,0,0,.5);
    text-align: center;
  }
  .card img { height: 46px; background: #fff; border-radius: 10px; padding: 5px 10px; margin-bottom: 18px; }
  .card h1 { font-size: 20px; margin-bottom: 4px; }
  .card .sub { font-size: 12px; color: #718096; margin-bottom: 26px; }
  label { display: block; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: #718096; margin: 12px 0 5px; }
  input {
    width: 100%; padding: 12px; font-size: 14px; text-align: left;
    background: #0f141e; color: #e2e8f0; border: 1px solid #2c3a52;
    border-radius: 8px; outline: none;
  }
  input:focus { border-color: #4b7da3; }
  button {
    width: 100%; margin-top: 22px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
    background: #4b7da3; color: #fff; border: none; border-radius: 8px;
  }
  button:hover { background: #5b8db3; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .err { color: #e53e3e; font-size: 12px; min-height: 18px; margin-top: 12px; }
  .foot { margin-top: 22px; font-size: 11px; color: #718096; line-height: 1.6; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: -2px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <img src="logo.jpg" alt="ADScope">
    <h1>ADScope</h1>
    <p class="sub">Estación de trabajo · asistente XAI para histología</p>

    <label for="u">Usuario</label>
    <input id="u" type="text" autocomplete="username" autofocus>

    <label for="p">Contraseña</label>
    <input id="p" type="password" autocomplete="current-password">

    <button id="btn">Entrar</button>
    <div class="err" id="err"></div>

    <p class="foot">
      Acceso con sesión segura y auditoría de acciones.<br>
      Sin cuenta: solicítala al administrador del laboratorio.
    </p>
  </div>

<script>
var btn = document.getElementById('btn');

async function doLogin() {
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Verificando…';
  document.getElementById('err').textContent = '';
  try {
    var r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('u').value,
        password: document.getElementById('p').value,
      }),
    });
    if (r.ok) {
      window.location.href = 'app.html';
      return;
    }
    var detail = 'Credenciales inválidas';
    try { detail = (await r.json()).detail || detail; } catch (e) {}
    document.getElementById('err').textContent = detail;
    document.getElementById('p').value = '';
    document.getElementById('p').focus();
  } catch (e) {
    document.getElementById('err').textContent = 'Sin conexión con el servidor';
  }
  btn.disabled = false;
  btn.textContent = 'Entrar';
}

btn.onclick = doLogin;
document.getElementById('p').onkeydown = function (e) { if (e.key === 'Enter') doLogin(); };
</script>
</body>
</html>
