<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADScope · Acceso</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #1c2637 0%, #0f141e 70%);
    color: #e2e8f0; padding: 20px;
  }
  .lock {
    width: 100%; max-width: 380px; text-align: center;
    background: #161e2e; border: 1px solid #2c3a52; border-radius: 16px;
    padding: 36px 30px; box-shadow: 0 12px 32px rgba(0,0,0,.5);
  }
  .lock img { height: 44px; background: #fff; border-radius: 10px; padding: 5px 10px; margin-bottom: 18px; }
  .lock h1 { font-size: 18px; margin-bottom: 6px; }
  .lock p { font-size: 12px; color: #718096; margin-bottom: 22px; }
  .lock input {
    width: 100%; padding: 12px; font-size: 14px; text-align: center;
    background: #0f141e; color: #e2e8f0; border: 1px solid #2c3a52;
    border-radius: 8px; outline: none; margin-bottom: 12px;
  }
  .lock input:focus { border-color: #4b7da3; }
  .lock button {
    width: 100%; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
    background: #4b7da3; color: #fff; border: none; border-radius: 8px;
  }
  .lock button:hover { background: #5b8db3; }
  .err { color: #e53e3e; font-size: 12px; min-height: 16px; margin-top: 10px; }
  .lock small { display: block; margin-top: 18px; font-size: 10px; color: #718096; line-height: 1.5; }
  .shake { animation: sh .3s; }
  @keyframes sh { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
</style>
</head>
<body>
  <div class="lock" id="lock">
    <img src="logo.jpg" alt="ADScope">
    <h1>ADScope</h1>
    <p>Estación de trabajo · acceso a la demostración</p>
    <input type="password" id="pw" placeholder="Contraseña" autofocus>
    <button id="btn">Entrar</button>
    <div class="err" id="err"></div>
    <small>
      Versión de presentación (sin backend).<br>
      Esta pantalla es una cortina de demostración, no seguridad real:
      en producción el acceso se protege con autenticación en el servidor.
    </small>
  </div>

<script>
/* Cortina de presentación: la clave va HASEADA (SHA-256), no en texto plano.
   ADVERTENCIA HONESTA: en alojamiento estático esto no es seguridad real —
   el JS es legible y el contenido es accesible. La seguridad real de ADScope
   vive en el backend (login con roles y auditoría). */
var HASH = '8f79773e4cbb01134736ae782f612cb26ef16fe90e2f4f93102bd8be4c3c8f83';

function sha256hex(s) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s))
    .then(function (buf) {
      return Array.from(new Uint8Array(buf))
        .map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    });
}

function tryUnlock() {
  var v = document.getElementById('pw').value;
  sha256hex(v).then(function (h) {
    if (h === HASH) {
      sessionStorage.setItem('adscope_gate', '1');
      window.location.href = 'app.html';
    } else {
      var err = document.getElementById('err');
      err.textContent = 'Contraseña incorrecta';
      var l = document.getElementById('lock');
      l.classList.remove('shake'); void l.offsetWidth; l.classList.add('shake');
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  });
}

document.getElementById('btn').onclick = tryUnlock;
document.getElementById('pw').onkeydown = function (e) { if (e.key === 'Enter') tryUnlock(); };

if (sessionStorage.getItem('adscope_gate') === '1') {
  window.location.href = 'app.html';
}
</script>
</body>
</html>
